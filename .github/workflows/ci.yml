name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for unused dependencies
        run: npm run deps:check

      - name: Type check
        run: npm run typecheck

      - name: Check release automation
        run: npm run release:test

      - name: Run linter
        run: npm run lint

      - name: Check for code duplication
        run: npm run duplication

      - name: Check for circular dependencies
        run: npm run madge

      - name: Compile TypeScript
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Run unit tests with per-file coverage
        run: npm run coverage:verify

      - name: Check for memory retention
        run: npm run memory:check

      - name: Package extension
        run: npm run package

      - name: Verify npm package contents
        run: npm run npm:pack:check
