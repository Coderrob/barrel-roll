name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for unused dependencies
        run: npm run deps:check

      - name: Type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Check for code duplication
        run: npm run duplication

      - name: Check for circular dependencies
        run: npm run madge

      - name: Compile TypeScript
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Run unit tests with per-file coverage
        run: npm run coverage:verify

      - name: Check for memory retention
        run: npm run memory:check

      - name: Package extension
        run: npm run ext:package -- --out "${{ runner.temp }}/barrel-roll.vsix"
